name = "gm-keff-uk"
main = "./src/index.js"
compatibility_date = "2026-10-11"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[previews]

[vars]
AI_DAILY_SERVICE_USD = "20"
MAILING_LIST_ENABLED = "true"

[[durable_objects.bindings]]
name = "ASSISTANT_LEDGER"
class_name = "AssistantLedger"

[[migrations]]
tag = "assistant-v1"
new_sqlite_classes = ["AssistantLedger"]
