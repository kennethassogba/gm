name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'openmc @ https://github.com/openmc-dev/openmc/archive/refs/tags/v0.15.3.tar.gz'
      - run: node scripts/export-fixtures.mjs
      - run: python scripts/validate-openmc.py
