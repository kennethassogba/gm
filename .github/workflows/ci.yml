name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenMC Python API
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --max-time 120 \
            https://github.com/openmc-dev/openmc/archive/refs/tags/v0.15.3.tar.gz \
            --output "$RUNNER_TEMP/openmc-0.15.3.tar.gz"
          pip install "$RUNNER_TEMP/openmc-0.15.3.tar.gz"
      - run: node scripts/export-fixtures.mjs
      - run: python scripts/validate-openmc.py
