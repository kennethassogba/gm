name = "gm-keff-uk"
main = "./src/index.js"
compatibility_date = "2026-10-11"

[[d1_databases]]
binding = "MAILING_DB"
database_name = "keff-updates"
database_id = "82526bcf-d7a9-44b0-8da6-1a64e0b9ae39"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[previews]

[vars]
MAILING_LIST_ENABLED = "true"

[[durable_objects.bindings]]
name = "SUBSCRIPTIONS"
class_name = "SubscriptionStore"

[exports.SubscriptionStore]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "PDF_IMPORT_LIMITS"
class_name = "PDFImportLimits"

[exports.PDFImportLimits]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "PDF_IMPORT_JOBS"
class_name = "PDFImportJob"

[exports.PDFImportJob]
type = "durable-object"
storage = "sqlite"
