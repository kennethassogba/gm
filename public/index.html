<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191e"><title>GM · OpenMC geometry studio</title>
<meta name="description" content="Create, edit and export OpenMC geometry in your browser.">
<meta property="og:type" content="website"><meta property="og:title" content="GM · OpenMC geometry studio">
<meta property="og:description" content="Your OpenMC geometry workspace."><meta property="og:url" content="https://gm.keff.uk/">
<meta property="og:image" content="https://gm.keff.uk/social-preview.png?v=2"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GM OpenMC geometry studio with a 3D assembly and section views.">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="GM · OpenMC geometry studio"><meta name="twitter:description" content="Your OpenMC geometry workspace."><meta name="twitter:image" content="https://gm.keff.uk/social-preview.png?v=2">
<link rel="icon" href="/icon.svg"><link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="/app.css">
<link rel="alternate" href="/llms.txt" type="text/plain" title="Agent API"><link rel="alternate" href="/.well-known/mcp.json" type="application/json" title="MCP server">
</head>
<body>
<a class="skip" href="#main">Skip to workspace</a>
<div class="shell">
<header class="header">
 <button id="home" class="brand" aria-label="Open model library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg><span>gm</span></button>
 <span class="header-divider"></span><button id="model-name" class="name-button">Models</button><span id="saved" class="saved" role="status"></span>
 <div class="header-actions">
  <button id="command" class="icon" aria-label="Open commands" title="Commands (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
  <button id="undo" class="icon" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="m8 5-5 5 5 5M3 10h10a7 7 0 0 1 0 14"/></svg></button>
  <button id="redo" class="icon" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="m16 5 5 5-5 5M21 10H11a7 7 0 0 0 0 14"/></svg></button>
  <button id="import" class="button">Import</button><button id="export" class="button primary" disabled>Export</button>
 </div>
</header>
<main id="main" tabindex="-1">
 <section id="library" class="library">
  <nav class="library-nav" aria-label="Model categories"><h1 tabindex="-1">Models</h1><button data-filter="all" aria-pressed="true">All models <span>13</span></button><button data-filter="components" aria-pressed="false">Components <span>4</span></button><button data-filter="benchmarks" aria-pressed="false">Benchmarks <span>4</span></button><button data-filter="architectures" aria-pressed="false">Reactors <span>5</span></button><div id="recent"></div><button id="empty" class="button">+ Empty geometry</button></nav>
  <div class="library-content"><div class="library-toolbar"><h2 id="category-title">All models</h2><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="Search models" placeholder="Fuel pin…"></label></div><div id="models" class="model-grid"></div></div>
 </section>
 <section id="editor" class="editor" hidden>
  <nav class="mobile-tabs" aria-label="Workspace panels"><button data-pane="tree" aria-pressed="false">Geometry</button><button data-pane="view" aria-pressed="true">View</button><button data-pane="properties" aria-pressed="false">Properties</button></nav>
  <aside id="tree-pane" class="pane tree-pane" aria-label="Geometry hierarchy"><div class="pane-header"><h2>Geometry</h2><button id="add" class="icon" aria-label="Add geometry" title="Add geometry">+</button></div><div class="tree-scroll"><div id="tree"></div><details open><summary>Materials</summary><div id="materials"></div><button id="add-material" class="subtle">+ Material</button></details><details><summary>Surfaces</summary><div id="surfaces"></div></details></div></aside>
  <section id="view-pane" class="view-pane" aria-label="Geometry views">
   <div class="view-toolbar"><div class="segments" role="group" aria-label="View"><button data-view="3d" aria-pressed="true">3D</button><button data-view="xy" aria-pressed="false">XY</button><button data-view="xz" aria-pressed="false">XZ</button><button data-view="yz" aria-pressed="false">YZ</button><button id="layout-tab" data-view="layout" aria-pressed="false" hidden>Layout</button></div><div class="view-actions"><button id="split" class="icon" aria-label="Show four views" title="Four views" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg></button><button id="cut" class="icon" aria-label="Show cutaway" title="Cutaway" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 12l8-4"/></svg></button><button id="transparent" class="icon" aria-label="Show transparent geometry" title="Transparency" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/></svg></button><button id="fit" class="icon" aria-label="Fit geometry" title="Fit (F)"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div>
   <nav id="path" class="path" aria-label="Geometry path"></nav>
   <div id="view-host" class="view-host" data-view="3d"><div class="view-frame frame-3d"><span class="axis">3D</span><canvas id="view-3d" tabindex="0" aria-label="3D geometry. Arrow keys rotate; plus and minus zoom."></canvas><div class="orbit-tools"><button id="rotate" aria-label="Rotate geometry" title="Rotate">↻</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div><div class="view-frame frame-xy"><span class="axis">XY</span><canvas id="view-xy" tabindex="0" aria-label="XY geometry section"></canvas></div><div class="view-frame frame-xz"><span class="axis">XZ</span><canvas id="view-xz" tabindex="0" aria-label="XZ geometry section"></canvas></div><div class="view-frame frame-yz"><span class="axis">YZ</span><canvas id="view-yz" tabindex="0" aria-label="YZ geometry section"></canvas></div><div id="layout-editor" class="layout-editor" hidden></div><div id="empty-view" class="empty-view" hidden><button id="add-first" class="button">+ Add geometry</button></div></div>
   <div class="view-bottom"><label>Color <select id="color"><option value="material">Material</option><option value="universe">Universe</option></select></label><label class="coolant"><input id="moderator" type="checkbox"> Moderator</label><label class="section-label" for="section">Section <input id="section" type="range" step=".01" min="-1" max="1" value="0"><output id="section-value">0 cm</output></label></div>
  </section>
  <aside id="properties-pane" class="pane properties-pane" aria-label="Selected geometry properties"><div class="pane-header"><h2 id="property-title">Properties</h2><span id="property-id" class="muted"></span></div><div id="properties" class="properties-scroll"></div></aside>
 </section>
</main>
<footer><a href="https://keff.uk" target="_blank" rel="noopener">A k<sub>eff</sub> product</a><span id="counts"></span><div><button id="validate" class="footer-button" hidden>Check geometry</button><a class="linkedin" href="https://www.linkedin.com/company/keffuk" target="_blank" rel="noopener" aria-label="k_eff on LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.85H15.8V14.1c0-1.1-.02-2.53-1.54-2.53-1.55 0-1.79 1.21-1.79 2.45v4.73H9.52V9.2h2.83v1.3h.04c.4-.75 1.36-1.54 2.8-1.54 3 0 3.56 1.98 3.56 4.55v5.24Z"/></svg></a></div></footer>
</div>
<input id="files" type="file" accept=".xml,.json" multiple hidden>
<dialog id="add-dialog"><div class="dialog-heading"><h2>Add geometry</h2><button data-close class="icon" aria-label="Close add geometry">×</button></div><div class="primitive-list"><button data-add="cylinder">Cylinder</button><button data-add="sphere">Sphere</button><button data-add="box">Box</button><button data-add="pin">Fuel pin</button><button data-add="lattice">Lattice</button></div></dialog>
<dialog id="export-dialog"><div class="dialog-heading"><h2>Export</h2><button data-close class="icon" aria-label="Close export">×</button></div><div class="export-list"><button data-export="geometry">geometry.xml <span>XML ↓</span></button><button data-export="materials">materials.xml <span>XML ↓</span></button><button data-export="python">model.py <span>PY ↓</span></button><button data-export="project">model.gm.json <span>GM ↓</span></button></div></dialog>
<dialog id="command-dialog"><div class="dialog-heading"><label for="command-search">Commands</label><button data-close class="icon" aria-label="Close commands">×</button></div><input id="command-search" type="search" placeholder="Cylinder…" autocomplete="off"><div id="commands" class="command-list"></div></dialog>
<dialog id="message-dialog"><div class="dialog-heading"><h2 id="message-title">Geometry check</h2><button data-close class="icon" aria-label="Close geometry check">×</button></div><div id="message-content"></div></dialog>
<div id="notice" class="notice" role="status"><span></span><button id="dismiss-notice" aria-label="Dismiss message">×</button></div>
<script type="module" src="/app.js"></script>
</body></html>
